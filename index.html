<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 TẢI APP </title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap">
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255,255,255,0.08);
      --card-2: rgba(255,255,255,0.12);
      --text: #f7f7ff;
      --muted: rgba(255,255,255,0.75);
      --line: rgba(255,255,255,0.12);
      --shadow: 0 18px 60px rgba(0,0,0,0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Be Vietnam Pro", sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #ff0080 0%, transparent 28%),
        radial-gradient(circle at top right, #00d4ff 0%, transparent 24%),
        radial-gradient(circle at bottom left, #ffe600 0%, transparent 26%),
        radial-gradient(circle at bottom right, #7c3aed 0%, transparent 24%),
        linear-gradient(135deg, #050816 0%, #0b1020 45%, #101b3c 100%);
      background-size: 300% 300%;
      animation: bgMove 10s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    body.party {
      animation: bgMove 4s linear infinite, bodyFlash 1.2s linear infinite;
      filter: saturate(1.5) contrast(1.08);
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes bodyFlash {
      0%, 100% { filter: hue-rotate(0deg) saturate(1.6) contrast(1.05); }
      25% { filter: hue-rotate(80deg) saturate(2.1) contrast(1.2); }
      50% { filter: hue-rotate(180deg) saturate(2.4) contrast(1.35); }
      75% { filter: hue-rotate(280deg) saturate(2.0) contrast(1.15); }
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
      background-size: 28px 28px;
      mix-blend-mode: screen;
      animation: noiseMove 2s linear infinite;
    }

    @keyframes noiseMove {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(28px,28px,0); }
    }

    .wrap {
      width: min(860px, 100%);
      position: relative;
      z-index: 2;
    }

    .hero {
      text-align: center;
      padding: 22px 18px 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      margin-bottom: 18px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .title {
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.04;
      font-weight: 900;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fff 0%, #fffb00 18%, #00f0ff 35%, #ff4dff 55%, #00ff85 75%, #fff 100%);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleFlow 2.5s linear infinite, blinkText .75s steps(2, end) infinite;
      text-shadow: 0 0 18px rgba(255,255,255,0.15);
    }

    @keyframes titleFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    @keyframes blinkText {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.72; }
    }

    .subtitle {
      margin-top: 14px;
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.7;
      animation: glowPulse 1.5s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 8px rgba(255,255,255,0.1); }
      50% { text-shadow: 0 0 18px rgba(0,255,255,0.35); }
    }

    .card {
      margin-top: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.08));
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(90deg, #ff004c, #ffea00, #00ffa6, #00d4ff, #a855f7, #ff004c);
      background-size: 300% 300%;
      z-index: -1;
      filter: blur(18px);
      opacity: 0.38;
      animation: borderGlow 5s linear infinite;
    }

    @keyframes borderGlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    .download-box {
      text-align: center;
      padding: 10px 8px 8px;
    }

    .download-label {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 12px;
      animation: fastBlink .45s linear infinite;
    }

    @keyframes fastBlink {
      0%, 49% { opacity: 1; transform: scale(1); }
      50%, 100% { opacity: .62; transform: scale(1.02); }
    }

    .download-btn {
      appearance: none;
      border: none;
      width: min(100%, 420px);
      margin: 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 22px;
      border-radius: 18px;
      cursor: pointer;
      color: #fff;
      font-size: clamp(1.05rem, 2.4vw, 1.4rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ff004c, #ff7a00, #ffe600, #00ff85, #00d4ff, #a855f7, #ff004c);
      background-size: 400% 100%;
      box-shadow:
        0 0 18px rgba(255, 255, 255, 0.16),
        0 0 38px rgba(255, 0, 76, 0.28),
        0 0 72px rgba(0, 212, 255, 0.2);
      animation: rainbowSlide 2s linear infinite, shake 0.25s infinite;
      transform-origin: center;
      text-shadow: 0 2px 10px rgba(0,0,0,0.28);
      transition: transform .2s ease, filter .2s ease;
    }

    .download-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.08) saturate(1.1);
    }

    .download-btn:active {
      transform: scale(0.98);
    }

    @keyframes rainbowSlide {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }

    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(1px, -1px) rotate(-0.3deg); }
      50% { transform: translate(-1px, 1px) rotate(0.3deg); }
      75% { transform: translate(1px, 1px) rotate(0deg); }
      100% { transform: translate(0, 0) rotate(-0.2deg); }
    }

    .download-hint {
      margin-top: 12px;
      color: rgba(255,255,255,0.8);
      font-size: .96rem;
      line-height: 1.6;
    }

    .blink-line {
      margin-top: 10px;
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      animation: quickColors 0.8s linear infinite;
      font-weight: 800;
    }

    @keyframes quickColors {
      0% { color: #ff4d4d; }
      20% { color: #ffd84d; }
      40% { color: #4dff88; }
      60% { color: #4dd9ff; }
      80% { color: #cb4dff; }
      100% { color: #ff4d4d; }
    }

    .footer {
      text-align: center;
      margin-top: 18px;
      color: rgba(255,255,255,0.65);
      font-size: .95rem;
    }

    .welcome-box {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      padding: 20px;
    }

    .welcome-content {
      width: min(440px, 100%);
      background: linear-gradient(180deg, rgba(20,25,50,0.98), rgba(10,14,30,0.98));
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .welcome-content::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      transform: translateX(-100%);
      animation: sweep 2.8s linear infinite;
    }

    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .welcome-content h3 {
      position: relative;
      z-index: 1;
      font-size: 1.35rem;
      line-height: 1.5;
      color: #fff;
      font-weight: 900;
      animation: quickColors 0.75s linear infinite, blinkText .5s steps(2,end) infinite;
      margin-bottom: 10px;
    }

    .welcome-content p {
      position: relative;
      z-index: 1;
      color: rgba(255,255,255,0.82);
      margin-bottom: 16px;
      line-height: 1.7;
    }

    #welcome-ok {
      position: relative;
      z-index: 1;
      border: none;
      cursor: pointer;
      padding: 13px 26px;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 900;
      color: white;
      background: linear-gradient(90deg, #ff004c, #ff7a00, #ffe600, #00ff85, #00d4ff, #a855f7, #ff004c);
      background-size: 400% 100%;
      animation: rainbowSlide 1.6s linear infinite, shake 0.28s infinite;
      box-shadow: 0 0 18px rgba(255,255,255,0.15), 0 0 34px rgba(255,0,76,0.22);
    }

    @media (max-width: 640px) {
      .card {
        padding: 18px;
        border-radius: 22px;
      }

      .download-btn {
        padding: 16px 18px;
        border-radius: 16px;
        letter-spacing: .5px;
      }

      .welcome-content {
        padding: 20px;
      }

      .welcome-content h3 {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <div class="welcome-box" id="welcome-box">
    <div class="welcome-content">
      <h3>Nhớ phần mềm này không dùng được cho iPhone 🗿</h3>
      <p>Dev web: Chienpro</p>
      <button id="welcome-ok">OKE NHÉ</button>
    </div>
  </div>

  <div class="wrap">
    <section class="hero">
      <div class="badge">
        <i class="fa-solid fa-bolt"></i>
        <span>Link Tải App Kid Code APK</span>
      </div>
      <h1 class="title">Tải App Tại Đây</h1>
      <p class="subtitle">Bấm nút bên dưới để chuyển sang trang tải app.</p>
    </section>

    <section class="card">
      <div class="download-box">
        <div class="download-label">⚡ Link tải app chính thức ⚡</div>

        <button id="download-app" class="download-btn">
          <i class="fa-solid fa-cloud-arrow-down"></i>
          Tải App Tại Đây
        </button>

        <div class="download-hint">
          Nhấn nút để chuyển sang trang web tải app.
        </div>

        <div class="blink-line">
          STEM KCBOT THPT CẢM NHÂN
        </div>
      </div>
    </section>

    <div class="footer">© 2025-2026 • Chienpro</div>
  </div>

  <script>
    const DOWNLOAD_URL = "https://sl1nk.com/xgdz2nk";
    const clickSound = new Audio("music/click.mp3");

    let currentMusic = null;
    let isMusicPlaying = false;
    let partyTimer = null;

    function safePlay(audio) {
      if (!audio) return;
      const p = audio.play();
      if (p && typeof p.catch === "function") {
        p.catch(() => {});
      }
    }

    function startPartyMode() {
      document.body.classList.add("party");

      const effects = [
        () => document.body.style.filter = "hue-rotate(0deg) saturate(1.8) contrast(1.05)",
        () => document.body.style.filter = "hue-rotate(80deg) saturate(2.2) contrast(1.15)",
        () => document.body.style.filter = "hue-rotate(160deg) saturate(2.6) contrast(1.25)",
        () => document.body.style.filter = "hue-rotate(240deg) saturate(2.1) contrast(1.18)",
        () => document.body.style.filter = "hue-rotate(320deg) saturate(2.4) contrast(1.22)"
      ];

      let i = 0;
      clearInterval(partyTimer);
      partyTimer = setInterval(() => {
        effects[i % effects.length]();
        i++;
      }, 180);
    }

    function stopPartyMode() {
      clearInterval(partyTimer);
      partyTimer = null;
      document.body.classList.remove("party");
      document.body.style.filter = "";
    }

    function startMusic() {
      if (isMusicPlaying) return;

      const randomIndex = Math.floor(Math.random() * 3) + 1;
      currentMusic = new Audio(`music/nhacnen${randomIndex}.mp3`);
      currentMusic.loop = true;
      safePlay(currentMusic);
      isMusicPlaying = true;
    }

    document.getElementById("welcome-ok").addEventListener("click", () => {
      safePlay(clickSound);
      document.getElementById("welcome-box").remove();

      startMusic();
      startPartyMode();
    });

    document.getElementById("download-app").addEventListener("click", () => {
      safePlay(clickSound);
      window.location.href = DOWNLOAD_URL;
    });

    window.addEventListener("beforeunload", () => {
      if (currentMusic) {
        currentMusic.pause();
        currentMusic.currentTime = 0;
      }
      stopPartyMode();
    });
  </script>
</body>
</html>
